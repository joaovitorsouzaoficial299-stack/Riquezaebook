<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HoraCerta · Acesso</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f6fa;color:#17202c;font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,480px)}.brand{font:800 19px Manrope;letter-spacing:.08em;color:#172b4d;margin-bottom:22px}.card{background:#fff;border:1px solid #e7ebf1;border-radius:18px;padding:30px;box-shadow:0 18px 55px #172b4d0d}.eyebrow{font-size:10px;letter-spacing:.16em;color:#3867f5;font-weight:700}h1{font:800 27px Manrope;margin:9px 0 7px}p{font-size:13px;color:#788392;line-height:1.6;margin:0 0 22px}.tabs{display:flex;gap:8px;background:#f3f5f8;padding:5px;border-radius:10px;margin-bottom:22px}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:7px;font-weight:700;color:#6b7584;cursor:pointer}.tabs button.active{background:#fff;color:#244ec7;box-shadow:0 1px 4px #00000012}.field{display:block;font-size:12px;font-weight:700;margin:13px 0 0}.field input{display:block;width:100%;margin-top:7px;border:1px solid #dfe4ec;border-radius:9px;padding:13px;font:14px 'DM Sans';outline:none}.field input:focus{border-color:#3867f5;box-shadow:0 0 0 3px #3867f51a}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.primary{width:100%;border:0;border-radius:9px;background:#315fe7;color:white;padding:14px;font-weight:700;font-size:13px;margin-top:22px;cursor:pointer}.primary:disabled{opacity:.6;cursor:wait}.msg{display:none;margin-top:16px;padding:12px;border-radius:9px;font-size:12px;line-height:1.5;background:#eef4ff;color:#244b9a}.msg.error{background:#fff0f0;color:#a32b2b}.muted{text-align:center;font-size:11px;margin:18px 0 0}.hidden{display:none!important}@media(max-width:420px){.card{padding:23px}.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand">HORA CERTA</div><section class="card"><span class="eyebrow">GESTÃO DO TEMPO DA SUA EMPRESA</span><h1 id="heading">Crie sua empresa</h1><p id="subheading">Cadastre sua conta de proprietário para configurar o ambiente da sua empresa.</p><div class="tabs"><button id="tab-signup" class="active" type="button">Criar conta</button><button id="tab-login" type="button">Entrar</button></div>
<form id="signup-form"><label class="field">Nome da empresa<input id="company-name" required minlength="2" placeholder="Ex.: Minha Empresa"></label><label class="field">Razão social (opcional)<input id="legal-name" placeholder="Razão social"></label><label class="field">CNPJ (opcional)<input id="cnpj" inputmode="numeric" placeholder="00.000.000/0000-00"></label><label class="field">Seu nome<input id="owner-name" required placeholder="Nome do proprietário"></label><label class="field">E-mail<input id="signup-email" type="email" required autocomplete="email" placeholder="voce@empresa.com"></label><label class="field">Senha<input id="signup-password" type="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo de 8 caracteres"></label><button class="primary" id="signup-button">Criar conta e empresa</button></form>
<form id="login-form" class="hidden"><label class="field">E-mail<input id="login-email" type="email" required autocomplete="email" placeholder="voce@empresa.com"></label><label class="field">Senha<input id="login-password" type="password" required autocomplete="current-password" placeholder="Sua senha"></label><button class="primary" id="login-button">Entrar no HoraCerta</button></form>
<div id="company-complete" class="hidden"><label class="field">Nome da empresa<input id="complete-company-name" required placeholder="Nome da empresa"></label><label class="field">Razão social (opcional)<input id="complete-legal-name" placeholder="Razão social"></label><label class="field">CNPJ (opcional)<input id="complete-cnpj" placeholder="00.000.000/0000-00"></label><button class="primary" id="complete-company-button">Concluir cadastro da empresa</button></div>
<div class="msg" id="message" role="status"></div><div class="muted">Cada empresa possui seu próprio proprietário e ambiente isolado.</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script><script src="/account.js"></script></body></html>
